# Font and cursor
font_family Ubuntu Sans Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
cursor #fc9505
cursor_text_color #140b05
cursor_shape block
cursor_blink_interval 0
shell_integration enabled no-cursor

# Amber palette
foreground #fc9505
background #140b05
background_opacity 0.95
dynamic_background_opacity yes
selection_foreground #140b05
selection_background #eebb44
url_color #7fd0d6
color0  #140b05
color1  #ff6f6f
color2  #6fdb88
color3  #eebb44
color4  #6fabff
color5  #c586c0
color6  #7fd0d6
color7  #fc9505
color8  #8c8c8c
color9  #ff8f8f
color10 #8fe8a6
color11 #ffd27a
color12 #9cc4ff
color13 #d9a6d6
color14 #a6e2e6
color15 #ffe4b8

# Layout and spacing
enabled_layouts splits,stack,tall,grid
window_padding_width 4
window_border_width 1pt
draw_minimal_borders yes
active_border_color #fc9505
inactive_border_color #2a1b0a
bell_border_color #eebb44
inactive_text_alpha 1.0
remember_window_size yes
initial_window_width 110c
initial_window_height 32c

# Tab bar
tab_bar_edge top
tab_bar_style separator
tab_separator " | "
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
active_tab_foreground #140b05
active_tab_background #fc9505
active_tab_font_style bold
inactive_tab_foreground #8c8c8c
inactive_tab_background #2a1b0a
inactive_tab_font_style normal
tab_bar_background #140b05
bell_on_tab "! "
tab_activity_symbol "* "

# History; pager limit is MB per pane
scrollback_lines 100000
scrollback_pager_history_size 256
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS --ignore-case +INPUT_LINE_NUMBER
scrollback_fill_enlarged_window yes
scrollbar never

# Bell and close confirmation
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
confirm_os_window_close -1
copy_on_select no

# Split in the current directory, restoring the layout if maximized
map ctrl+shift+o combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+shift+e combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+shift+a combine : goto_layout splits : launch --location=split --cwd=current
map ctrl+shift+enter combine : goto_layout splits : launch --location=split --cwd=current
map ctrl+shift+x toggle_layout stack
map ctrl+shift+z toggle_layout stack

# Pane focus
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map ctrl+tab next_window
map ctrl+shift+tab previous_window

# Resize active pane
map ctrl+shift+h resize_window narrower 2
map ctrl+shift+j resize_window shorter 2
map ctrl+shift+k resize_window taller 2
map ctrl+shift+l resize_window wider 2
map ctrl+alt+0 reset_window_sizes

# Move panes and switch layouts
map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right
map ctrl+alt+r layout_action rotate
map ctrl+alt+shift+r layout_action rotate 270
map alt+e command_palette
map ctrl+shift+space next_layout

# Tabs and OS windows
map ctrl+shift+t new_tab_with_cwd
map ctrl+page_down next_tab
map ctrl+page_up previous_tab
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up move_tab_backward
map ctrl+alt+a set_tab_title
map ctrl+shift+i new_os_window_with_cwd
map ctrl+shift+n no_op
map ctrl+shift+w close_window_with_confirmation ignore-shell
map ctrl+shift+q close_os_window
map f11 toggle_fullscreen
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Clipboard and font zoom
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size current +1.0
map ctrl+equal change_font_size current +1.0
map ctrl+minus change_font_size current -1.0
map ctrl+0 change_font_size current 0

# Search and command history
map ctrl+shift+f search_scrollback
map ctrl+alt+h show_scrollback
map ctrl+alt+g show_last_command_output
map ctrl+alt+up scroll_to_prompt -1
map ctrl+alt+down scroll_to_prompt 1
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# URL hints
map ctrl+alt+u kitten hints --type=url

# Reset and clear
map ctrl+shift+r clear_terminal reset active
map ctrl+shift+g clear_terminal clear active

# Edit, reload, inspect config
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
